<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TWENDE — Financial Wellness for East Africa</title>
    <script>
      // Detect if opened via file:// protocol and show warning
      if (window.location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="padding:40px;font-family:sans-serif;text-align:center;">' +
              '<h1>TWENDE App Cannot Run from file://</h1>' +
              '<p>This app must be served through a web server.</p>' +
              '<p><strong>To run locally:</strong> Use <code>npm run preview</code> or <code>npm run dev</code></p>' +
              '<p><strong>To deploy:</strong> Upload the <code>dist/</code> folder to Vercel, Netlify, or any static host.</p>' +
              '</div>';
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:40px;font-family:sans-serif;text-align:center;">
        <h1>JavaScript Required</h1>
        <p>TWENDE is a modern web application that requires JavaScript to function.</p>
        <p>Please enable JavaScript in your browser settings and reload the page.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
